plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.11.0'
}

repositories {
    mavenCentral()
}

spotless {
    lineEndings = 'UNIX'
    java {
        target 'src/**/*.java'
        palantirJavaFormat().style('PALANTIR').formatJavadoc(true)
        removeUnusedImports()
    }
    format 'shout', {
        target '*.txt'
        // A Groovy closure: serializable in Gradle's configuration cache, but it references the build
        // script class, which the worker cannot load -> this format must fall back to the build tool.
        custom 'shout', { String text -> text.toUpperCase() }
    }
}
