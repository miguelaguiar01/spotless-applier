name: Build
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Maven local repository (parity corpus)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('fixtures/**/pom.xml') }}
      - name: Build plugin and run all tests (incl. parity corpus)
        run: ./gradlew --no-daemon build buildPlugin
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            build/reports/tests
            */build/reports/tests
      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: plugin
          path: build/distributions/*.zip

  verify:
    name: Plugin verifier
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run plugin verifier against recommended IDEs
        run: ./gradlew --no-daemon verifyPlugin
      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verifier-report
          path: build/reports/pluginVerifier
